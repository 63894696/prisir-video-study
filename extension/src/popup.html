<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Prisir 视频学习</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; font-family: "Sora", system-ui, sans-serif;
      background: linear-gradient(165deg, #0e1116, #171c24); color: #e8dcc6; }
    header { padding: 14px 16px 10px; border-bottom: 1px solid rgba(232,220,198,.1); }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .sub { font-size: 11px; color: #9aa3b2; margin: 3px 0 0; }
    section { padding: 12px 16px; }
    .status { display: flex; gap: 10px; align-items: flex-start; }
    .led { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; background: #5a636f; }
    .led.ok { background: #3fbf7f; box-shadow: 0 0 6px rgba(63,191,127,.6); }
    .led.warn { background: #e8b23c; }
    .status-text { flex: 1; font-size: 13px; line-height: 1.5; }
    .muted { color: #9aa3b2; font-size: 11px; margin-top: 2px; }
    .howto { font-size: 12px; color: #9aa3b2; line-height: 1.7; }
    .howto b { color: #e8dcc6; font-weight: 600; }
    input { width: 100%; margin: 5px 0; padding: 7px 9px; background: #0a0c10; color: #e8dcc6;
      border: 1px solid rgba(232,220,198,.18); border-radius: 6px; font: inherit; font-size: 12px; }
    input:focus { outline: none; border-color: #e09a55; }
    button { cursor: pointer; font: inherit; border-radius: 6px; border: 1px solid rgba(232,220,198,.2);
      background: rgba(255,255,255,.05); color: #e8dcc6; padding: 7px 12px; font-size: 12px; }
    button.primary { background: rgba(196,122,58,.2); border-color: rgba(224,154,85,.55); color: #e09a55; font-weight: 600; width: 100%; }
    button.link-btn { background: none; border: none; color: #e09a55; padding: 4px; font-size: 11px; text-decoration: underline; }
    .row { display: flex; gap: 6px; }
    #adv-msg { font-size: 11px; margin-top: 6px; min-height: 14px; }
    footer { padding: 10px 16px; border-top: 1px solid rgba(232,220,198,.1); display: flex; justify-content: space-between; align-items: center; }
    details summary { cursor: pointer; font-size: 12px; color: #9aa3b2; padding: 2px 0; }
    details summary:hover { color: #e09a55; }
  </style>
</head>
<body>
  <header>
    <h1>视频学习</h1>
    <p class="sub">双语字幕 + AI 帧笔记 · 密钥仅存本机</p>
  </header>

  <section class="status">
    <div class="led" id="led"></div>
    <div class="status-text">
      <div id="status-line">检测中…</div>
      <div id="status-meta" class="muted"></div>
    </div>
  </section>

  <section>
    <div class="howto">
      <b>用法:</b>打开任意视频页 → <b>悬停视频</b> → 点右上角浮出的「✎ 视频学习」→
      双语字幕 + AI 笔记同时开始。笔记带时间戳可跳回,看完导出 Markdown。
    </div>
  </section>

  <section>
    <details id="adv">
      <summary>端点配置(字幕翻译 + 帧笔记)</summary>
      <input type="text" id="baseURL" placeholder="API Base URL,如 https://apihub.agnes-ai.com/v1" />
      <input type="text" id="model" placeholder="模型名(字幕翻译)" />
      <input type="text" id="visionModel" placeholder="多模态模型(帧笔记,留空复用上面)" />
      <input type="password" id="apiKey" placeholder="API Key(仅存本机)" autocomplete="off" />
      <div class="row">
        <button id="save-adv" class="primary">保存</button>
        <button id="test-service">测试</button>
      </div>
      <div id="adv-msg" class="muted"></div>
    </details>
  </section>

  <footer>
    <span class="muted" id="ft">Prisir</span>
    <button id="open-options" class="link-btn">更多设置</button>
  </footer>

  <script src="langs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
